[PATH]
DATA_PATH = ./Data
Output_PATH = ./Output

[Model]
name = openai:qwen3.5-plus
temperature = 0
; Per-request timeout (seconds) for LLM API calls, shared by all agent builders.
request_timeout = 120

[GeoAgent]
base_url = http://127.0.0.1:8002

[DeepAgent]
; root_dir/env_dict configure the sandbox; adjust to your local environment (e.g. conda env path)
root_dir = ./Agents
env_dict = {"PATH": "/usr/bin:/bin"}

[Eval]
timeout_seconds = 1200
max_workers = 4
